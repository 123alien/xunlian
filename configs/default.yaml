# TL-TFAD default configuration

data:
  raw_dir: data/raw
  processed_dir: data/processed
  window_size: 24
  horizon: 1
  train_ratio: 0.6
  val_ratio: 0.2
  test_ratio: 0.2

model:
  type: lstm
  hidden_dim: 128
  num_layers: 2
  dropout: 0.2

train:
  batch_size: 64
  learning_rate: 0.001
  weight_decay: 0.0001
  epochs: 100
  early_stopping_patience: 10
  pretrain_epochs: 50
  finetune_epochs: 30
  finetune_lr: 0.0001

anomaly:
  mad_window: 24
  threshold: 3.0
  epsilon: 0.00000001

seed: 42
